name: Distribution checks
"on":
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  distribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check documentation, release status and downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/check_distribution.py --downloads
